events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://svelte-app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket proxy
        location /ws/ {
            proxy_pass http://websocket-server:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
# When a user visits http://localhost:8080, their browser sends an HTTP request to port 8080 
# on the host machine, which is mapped to port 80 inside the Nginx container.
# Nginx receives the request and, based on its configuration, proxies the request to the Svelte app container on port 3000, which serves its static files (HTML, CSS, JS) to render the chat app in the browser. 
# When the user starts a chat, the frontend establishes a WebSocket connection to ws://localhost:8080/ws, which is intercepted by Nginx and proxied to the WebSocket server container on port 3001. 
# The WebSocket server, using Node.js and ws, accepts the connection, enabling real-time bidirectional communication. 
# When the user sends a message, it is transmitted to the WebSocket server, which broadcasts it to all connected clients, ensuring all users in the chat see the message instantly.